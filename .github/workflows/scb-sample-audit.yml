name: Granska 100 SCB-arbetsställen säkert
on:
  push:
    paths:
      - 'audit_scb_sample.py'
      - '.github/workflows/scb-sample-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scb-sample-audit
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa 100 poster utan att publicera identifierande data
        env:
          SCB_API_KEY: ${{ secrets.SCB_API_KEY }}
        run: python audit_scb_sample.py
      - name: Publicera enbart icke-identifierande provsammanställning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scb_sample_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update SCB 100-record schema-only sample audit"
          git pull --rebase origin main
          git push
