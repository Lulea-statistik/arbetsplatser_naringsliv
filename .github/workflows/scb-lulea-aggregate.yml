name: Hämta aggregerad arbetsställestatistik Luleå
on:
  push:
    paths:
      - 'fetch_scb_lulea_aggregate.py'
      - '.github/workflows/scb-lulea-aggregate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scb-lulea-aggregate
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta alla sidor utan att publicera individposter
        env:
          SCB_API_KEY: ${{ secrets.SCB_API_KEY }}
        run: python fetch_scb_lulea_aggregate.py
      - name: Publicera endast aggregerade summeringar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scb_lulea_aggregate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update anonymized SCB Lulea workplace aggregates"
          git pull --rebase origin main
          git push
