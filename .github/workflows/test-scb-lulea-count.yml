name: Testa SCB arbetsställen Luleå (antal)
on:
  push:
    paths:
      - 'test_scb_lulea_count.py'
      - '.github/workflows/test-scb-lulea-count.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera SCB API-nyckel och antal arbetsställen i kommun 2580
        env:
          SCB_API_KEY: ${{ secrets.SCB_API_KEY }}
        run: python test_scb_lulea_count.py
