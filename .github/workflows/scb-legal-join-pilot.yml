name: SCB juridisk form – fullständig Luleåmatchning
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scb-legal-batch-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera alla sidor och redovisa enbart sammanräknad täckning
        env:
          SCB_API_KEY: ${{ secrets.SCB_API_KEY }}
        run: python pilot_scb_legal_batch.py
      - name: Publicera endast aggregerad täckningsstatistik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scb_legal_form_coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh aggregate SCB legal form coverage"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
