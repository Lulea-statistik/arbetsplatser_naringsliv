name: Testa SCB publiceringsskydd
on:
  push:
    paths:
      - 'scb_publication_rules.py'
      - 'test_scb_publication_rules.py'
      - '.github/workflows/scb-publication-rules-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera maskering utan riktiga personuppgifter
        run: python -m unittest -v test_scb_publication_rules.py
