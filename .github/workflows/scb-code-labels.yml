name: Kontrollera SCB kodtexter och juridisk enhetsstruktur
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta publika kodtabeller och kontrollera endast fältnamn
        env:
          SCB_API_KEY: ${{ secrets.SCB_API_KEY }}
        run: python inspect_scb_code_labels.py
      - name: Spara enbart publika kodtexter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scb_code_labels.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update public SCB code labels"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((10 * attempt))
          done
          exit 1
