name: Hämta SCB arbetsställen Luleå
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: write
concurrency:
  group: scb-workplaces-lulea
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hämta och validera arbetsställen för Luleå (2580)
        env:
          SCB_API_URL: ${{ secrets.SCB_API_URL }}
          SCB_API_KEY: ${{ secrets.SCB_API_KEY }}
          SCB_API_QUERY_JSON: ${{ secrets.SCB_API_QUERY_JSON }}
          SCB_API_METHOD: ${{ vars.SCB_API_METHOD || 'POST' }}
          SCB_API_KEY_HEADER: ${{ vars.SCB_API_KEY_HEADER || 'x-api-key' }}
          SCB_PUBLICATION_APPROVED: ${{ vars.SCB_PUBLICATION_APPROVED || 'false' }}
        run: python fetch_scb_workplaces.py
      - name: Publicera validerade uppgifter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/arbetsstallen_lulea.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh SCB Luleå workplaces"
          git pull --rebase origin main
          git push
